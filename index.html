<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUT Config Builder</title>
  <link rel="icon" href="img/icon.ico">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="img/icon.ico" alt="">
      <div>
        <h1>DUT Config Builder</h1>
        <p>Device configuration files for the Avnu Express Test Suite</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn ghost" id="btn-import">Import file</button>
      <button type="button" class="btn ghost" id="btn-reset">Start over</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
    </div>
  </header>

  <main class="layout">
    <div class="main-col">
      <section class="profiles" aria-labelledby="profiles-title">
        <div class="profiles-head">
          <div>
            <h2 id="profiles-title">What do you want to test?</h2>
            <p>Settings that the selected profiles do not use stay greyed out and are left out of the file.</p>
          </div>
          <button type="button" class="link" id="btn-all">Select all</button>
        </div>
        <div id="profile-list" class="profile-list"></div>
      </section>
      <div id="form"></div>
    </div>

    <aside class="side-col" aria-label="Generated file">
      <div class="output">
        <div class="output-head">
          <h2>Configuration file</h2>
        </div>
        <div id="status" class="status"></div>
        <div id="issues" class="issues"></div>
        <pre id="preview" class="preview"></pre>
        <div class="output-actions">
          <button type="button" class="btn ghost-dark" id="btn-copy">Copy</button>
          <button type="button" class="btn primary" id="btn-download">Download JSON</button>
        </div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Core helpers -->
  <script src="js/core/util.js"></script>
  <script src="js/core/registry.js"></script>

  <!-- Schema: one file per section. To add a section, add a file and a line here. -->
  <script src="js/schema/profiles.js"></script>
  <script src="js/schema/general.js"></script>
  <script src="js/schema/milan.js"></script>
  <script src="js/schema/gptp.js"></script>
  <script src="js/schema/switch.js"></script>
  <script src="js/schema/debug.js"></script>

  <!-- Engine -->
  <script src="js/core/store.js"></script>
  <script src="js/core/validation.js"></script>
  <script src="js/core/serializer.js"></script>
  <script src="js/core/json.js"></script>

  <!-- UI -->
  <script src="js/ui/fields.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
